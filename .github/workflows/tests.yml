name: Petstore API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Petstore.Tests.csproj

      - name: Run API tests
        id: tests
        continue-on-error: true
        run: dotnet test Petstore.Tests.csproj --no-restore --logger "trx;LogFileName=PetstoreResults.trx" --results-directory TestResults --verbosity normal

      - name: Write test summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("TestResults/PetstoreResults.trx")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as output:
              output.write("## Petstore API — test results\n\n")
              if not report.exists():
                  output.write("Test report was not generated. Inspect workflow logs.\n")
              else:
                  root = ET.parse(report).getroot()
                  namespace = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
                  counters = root.find(".//t:Counters", namespace)
                  if counters is not None:
                      output.write("| Total | Passed | Failed | Skipped |\n")
                      output.write("| ---: | ---: | ---: | ---: |\n")
                      output.write(f"| {counters.get('total', '0')} | {counters.get('passed', '0')} | {counters.get('failed', '0')} | {int(counters.get('notExecuted', '0')) + int(counters.get('inconclusive', '0'))} |\n\n")
                  output.write("| Test | Outcome |\n| --- | --- |\n")
                  for result in root.findall(".//t:UnitTestResult", namespace):
                      output.write(f"| `{result.get('testName', '')}` | {result.get('outcome', '')} |\n")
                  output.write("\nDownload the TRX file from the workflow artifacts.\n")
          PY

      - name: Upload TRX report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petstore-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
